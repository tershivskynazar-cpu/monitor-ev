name: EVBOOST monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evboost-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect EVBOOST data for one hour
        run: |
          for i in {1..12}; do
            echo "Collect sample $i/12"
            python evboost_monitor.py --once --report --quiet
            if [ "$i" -lt 12 ]; then
              sleep 300
            fi
          done

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evboost_history.csv data/evboost_report.txt
          git diff --cached --quiet || git commit -m "Collect EVBOOST hourly data"
          git pull --rebase
          git push
