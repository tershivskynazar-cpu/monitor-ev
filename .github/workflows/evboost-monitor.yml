name: EVBOOST monitor

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    - cron: "4 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evboost-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect one EVBOOST sample
        run: python evboost_monitor.py --once --report --quiet

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evboost_history.csv data/evboost_report.txt
          git diff --cached --quiet || git commit -m "Collect EVBOOST data"
          git push origin HEAD:main
